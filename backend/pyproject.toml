[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fobol-engineering-backend"
version = "0.1.0"
description = "API Backend y Orquestador para la Biblioteca Virtual de Ingeniería y Calculadoras Normativas - Forjas Bolívar"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "psycopg[binary,pool]>=3.2.0",
    "alembic>=1.13.2",
    "pgvector>=0.3.5",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.12",
    "celery>=5.4.0",
    "redis>=5.1.0",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "weasyprint>=62.3",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.8",
    "mypy>=1.11.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

